{% extends "base.html" %}

{% block title %}Login - MediCare HMS{% endblock %}

{% block content %}
<div class="row justify-content-center align-items-center py-4">
    <div class="col-md-8 col-lg-5">
        <div class="card auth-card shadow-lg border-0">
            <div class="card-header bg-primary text-white p-4 text-center">
                <i class="bi bi-shield-lock-fill display-5 text-info mb-2"></i>
                <h3 class="fw-bold mb-1">System Login</h3>
                <p class="small text-light opacity-75 mb-0">Sign in using your Email or Phone Number</p>
            </div>
            <div class="card-body p-4 p-md-5">
                <form method="POST" action="{{ url_for('auth.login', next=request.args.get('next')) }}">
                    <!-- CSRF Token -->
                    <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

                    <div class="mb-3">
                        <label for="identifier" class="form-label fw-semibold">
                            <i class="bi bi-person me-1 text-primary"></i> Email or Phone Number
                        </label>
                        <input type="text" class="form-control form-control-lg" id="identifier" name="identifier" 
                               value="{{ identifier or '' }}" placeholder="name@hospital.local or +1234567890" required autofocus>
                    </div>

                    <div class="mb-4">
                        <label for="password" class="form-label fw-semibold">
                            <i class="bi bi-key me-1 text-primary"></i> Password
                        </label>
                        <input type="password" class="form-control form-control-lg" id="password" name="password" 
                               placeholder="Enter your password" required>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember_me" name="remember_me">
                            <label class="form-check-label text-muted small" for="remember_me">
                                Remember this session
                            </label>
                        </div>
                    </div>

                    <div class="d-grid mb-3">
                        <button type="submit" class="btn btn-primary btn-lg fw-bold shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-2"></i> Log In
                        </button>
                    </div>

                    <div class="text-center mt-4 pt-3 border-top">
                        <p class="text-muted small mb-0">
                            New patient? 
                            <a href="{{ url_for('auth.register') }}" class="fw-bold text-primary text-decoration-none">
                                Register for an account
                            </a>
                        </p>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
