{% extends "base.html" %}

{% block title %}500 Server Error - MediCare HMS{% endblock %}

{% block content %}
<div class="row justify-content-center text-center py-5">
    <div class="col-md-8 col-lg-6">
        <div class="card p-5 shadow border-0">
            <div class="mb-4">
                <i class="bi bi-exclamation-octagon text-danger display-1"></i>
            </div>
            <h1 class="display-6 fw-bold text-danger mb-2">500 - Internal Server Error</h1>
            <p class="lead text-muted mb-4">
                An unexpected error occurred while processing your request. Our technical team has been notified.
            </p>
            <div>
                <a href="{{ url_for('main.index') }}" class="btn btn-primary fw-semibold">
                    <i class="bi bi-house me-1"></i> Return Home
                </a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
