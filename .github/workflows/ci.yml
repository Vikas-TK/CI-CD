name: Continuous Integration (CI)

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Lint & Automated Pytest
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      # STAGE 1 — CHECKOUT
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Full history for Sonar analysis

      # STAGE 2 — PYTHON SETUP
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # STAGE 3 — BUILD AND VALIDATION
      - name: Lint and Syntax Validation (Flake8)
        run: |
          # Stop the build if there are Python syntax errors or undefined names
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          # Exit-zero treats all errors as warnings. Max line length set to 127
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Validate Application Import and Configuration
        run: |
          python -c "from app import create_app; app = create_app('testing'); print('App loaded successfully:', app.name)"

      # STAGE 4 — AUTOMATED TESTS
      - name: Run Test Suite with Pytest & Generate Reports
        env:
          FLASK_ENV: testing
          WTF_CSRF_ENABLED: "false"
        run: |
          mkdir -p test-results
          pytest -v \
            --junitxml=test-results/junit.xml \
            --cov=app \
            --cov-report=xml:test-results/coverage.xml \
            --cov-report=term-missing

      - name: Upload Test Results and Coverage Artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results-py${{ matrix.python-version }}
          path: test-results/
          retention-days: 14

      # STAGE 5 — SONARQUBE / SONARCLOUD STATIC ANALYSIS
      - name: SonarCloud / SonarQube Code Quality Analysis
        if: matrix.python-version == '3.11' && secrets.SONAR_TOKEN != ''
        uses: SonarSource/sonarcloud-github-action@v3.1.0
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL || 'https://sonarcloud.io' }}

      # STAGE 6 — WORKFLOW RESULT SUMMARY
      - name: CI Summary Report
        if: always()
        run: |
          echo "### 🚀 CI Pipeline Execution Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **Python Version**: ${{ matrix.python-version }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Branch/Ref**: \`${{ github.ref }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Pytest Status**: Automated tests completed with JUnit XML generated." >> $GITHUB_STEP_SUMMARY
