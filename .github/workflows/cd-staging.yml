name: Continuous Deployment (CD - Staging)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    branches: [main, develop]
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy-staging:
    name: Build Container & Verify Staging Deployment
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' || github.event_name == 'workflow_dispatch' }}
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Docker Image
        run: |
          docker build -t medicare-hms:staging .

      - name: Launch Staging Container for Health Verification
        env:
          SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY || 'staging-test-secret-key-12345' }}
          FLASK_ENV: testing
        run: |
          docker run -d --name hms-staging-check \
            -p 5000:5000 \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e FLASK_ENV="testing" \
            medicare-hms:staging

      - name: Verify Staging Health Check Endpoint
        run: |
          echo "Waiting for staging application container to initialize..."
          sleep 5
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || true)
            echo "Attempt $i: Health check HTTP status $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Health check passed with HTTP 200 OK!"
              curl -s http://localhost:5000/health
              break
            fi
            sleep 3
          done
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Health check failed after 10 attempts."
            docker logs hms-staging-check
            exit 1
          fi

      - name: Stop & Cleanup Test Container
        if: always()
        run: |
          docker stop hms-staging-check || true
          docker rm hms-staging-check || true

      - name: Record Staging Deployment Summary
        if: always()
        run: |
          echo "### 🚢 CD Staging Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: Staging" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Build**: \`medicare-hms:staging\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Endpoint**: \`/health\` -> **HTTP 200 OK**" >> $GITHUB_STEP_SUMMARY
