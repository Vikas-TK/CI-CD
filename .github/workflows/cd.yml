name: Continuous Deployment (CD)

on:
  workflow_run:
    workflows: ["Continuous Integration (CI)"]
    branches: [main, develop]
    types:
      - completed
  workflow_dispatch:

concurrency:
  group: cd-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # =========================================================================
  # STAGING DEPLOYMENT (TRIGGERED ON DEVELOP BRANCH MERGE / PUSH)
  # =========================================================================
  deploy-staging:
    name: Deploy to Staging Environment
    runs-on: ubuntu-latest
    if: >-
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/develop')
    environment:
      name: staging
      url: https://staging.medicare-hms.example.com
    
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Docker Image (Staging)
        run: |
          docker build -t medicare-hms:staging .

      - name: Launch Staging Container for Health Verification
        env:
          SECRET_KEY: ${{ secrets.STAGING_SECRET_KEY || 'staging-deployment-secret-key-12345' }}
          FLASK_ENV: testing
        run: |
          docker run -d --name hms-staging-app \
            -p 5000:5000 \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e FLASK_ENV="testing" \
            medicare-hms:staging

      - name: Verify Staging Health Check Endpoint
        run: |
          echo "Waiting for staging application container to initialize..."
          sleep 5
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || true)
            echo "Attempt $i: Health check HTTP status $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Staging health check passed with HTTP 200 OK!"
              curl -s http://localhost:5000/health
              break
            fi
            sleep 3
          done
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Staging health check failed after 10 attempts."
            docker logs hms-staging-app
            exit 1
          fi

      - name: Stop & Cleanup Staging Verification Container
        if: always()
        run: |
          docker stop hms-staging-app || true
          docker rm hms-staging-app || true

      - name: Record Staging Deployment Summary
        if: always()
        run: |
          echo "### 🚢 CD Staging Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`staging\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Tag**: \`medicare-hms:staging\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Endpoint**: \`/health\` -> **HTTP 200 OK**" >> $GITHUB_STEP_SUMMARY

  # =========================================================================
  # PRODUCTION DEPLOYMENT (TRIGGERED ON MAIN BRANCH MERGE / PUSH)
  # =========================================================================
  deploy-production:
    name: Deploy to Production Environment
    runs-on: ubuntu-latest
    if: >-
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    environment:
      name: production
      url: https://medicare-hms.example.com

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Application Docker Image (Production)
        run: |
          docker build -t medicare-hms:production .

      - name: Launch Production Container for Health Verification
        env:
          SECRET_KEY: ${{ secrets.PROD_SECRET_KEY || 'prod-deployment-secret-key-67890' }}
          FLASK_ENV: testing
        run: |
          docker run -d --name hms-prod-app \
            -p 5000:5000 \
            -e SECRET_KEY="${SECRET_KEY}" \
            -e FLASK_ENV="testing" \
            medicare-hms:production

      - name: Verify Production Health Check Endpoint
        run: |
          echo "Waiting for production application container to initialize..."
          sleep 5
          for i in {1..10}; do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" http://localhost:5000/health || true)
            echo "Attempt $i: Health check HTTP status $STATUS"
            if [ "$STATUS" -eq 200 ]; then
              echo "✅ Production health check passed with HTTP 200 OK!"
              curl -s http://localhost:5000/health
              break
            fi
            sleep 3
          done
          
          if [ "$STATUS" -ne 200 ]; then
            echo "❌ Production health check failed after 10 attempts."
            docker logs hms-prod-app
            exit 1
          fi

      - name: Stop & Cleanup Production Verification Container
        if: always()
        run: |
          docker stop hms-prod-app || true
          docker rm hms-prod-app || true

      - name: Record Production Deployment Summary
        if: always()
        run: |
          echo "### 🚀 CD Production Deployment Status" >> $GITHUB_STEP_SUMMARY
          echo "- **Target Environment**: \`production\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Trigger Commit**: \`${{ github.sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Container Tag**: \`medicare-hms:production\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Health Endpoint**: \`/health\` -> **HTTP 200 OK**" >> $GITHUB_STEP_SUMMARY
